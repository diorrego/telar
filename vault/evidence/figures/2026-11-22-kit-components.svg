<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="Inter, Helvetica, Arial, sans-serif">
<!-- Evidence. Translated from Spanish on 2026-11-24. Original: componentes-del-kit.svg (research workspace). -->
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect width="1200" height="780" fill="#ffffff"/><text x="40" y="36" text-anchor="start" font-size="16" font-weight="600" fill="#1f2937">Kit components · v0 (solid line) and later extensions (dashed line)</text><rect x="40" y="58" width="760" height="92" rx="10" fill="none" stroke="#9ca3af"/><text x="56" y="80" text-anchor="start" font-size="12" font-weight="600" fill="#6b7280">Input channels</text><rect x="60" y="90" width="220" height="48" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="170.0" y="110.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Local CLI</text><text x="170.0" y="127.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">abrir · run · status · report</text><rect x="300" y="90" width="220" height="48" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4"/><text x="410.0" y="110.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Issue / PR comment</text><text x="410.0" y="127.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">v0.x</text><rect x="540" y="90" width="240" height="48" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4"/><text x="660.0" y="110.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Slack · Sentry · schedule</text><text x="660.0" y="127.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">v1 (requires a service)</text><rect x="40" y="176" width="760" height="214" rx="10" fill="#fafafa" stroke="#15803d" stroke-width="1.5"/><text x="56" y="198" text-anchor="start" font-size="12" font-weight="600" fill="#15803d">Core · deterministic code, no LLM</text><rect x="60" y="212" width="350" height="76" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="235.0" y="237.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Protocol engine (reconciler)</text><text x="235.0" y="254.55" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">reads facts from the forge and the dossier,</text><text x="235.0" y="271.55" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">computes the state and runs the next step</text><rect x="430" y="212" width="350" height="76" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="605.0" y="237.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Policy compiler</text><text x="605.0" y="254.55" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">from the manifest to per-stage permissions:</text><text x="605.0" y="271.55" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">native harness config + CI checks</text><rect x="60" y="300" width="350" height="76" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="235.0" y="325.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Dossier</text><text x="235.0" y="342.55" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">estado.md, specs, log, verification,</text><text x="235.0" y="359.55" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">resumen.html, run records</text><rect x="430" y="300" width="350" height="76" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="605.0" y="325.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Reports and measurement</text><text x="605.0" y="342.55" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">times, human wait, cost,</text><text x="605.0" y="359.55" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">corrections at 14/30 days</text><rect x="40" y="416" width="760" height="150" rx="10" fill="none" stroke="#9ca3af"/><text x="56" y="438" text-anchor="start" font-size="12" font-weight="600" fill="#6b7280">Ports and adapters (with conformance suite)</text><rect x="60" y="450" width="230" height="48" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="175.0" y="470.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Forge: GitHub</text><text x="175.0" y="487.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">issues, PR, reviews, checks</text><rect x="60" y="506" width="230" height="46" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4"/><text x="175.0" y="525.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">GitLab · Gitea</text><text x="175.0" y="542.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">v1</text><rect x="305" y="450" width="230" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="420.0" y="470.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Executor: Claude Code</text><text x="420.0" y="487.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">headless, one session per stage</text><rect x="305" y="506" width="230" height="46" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4"/><text x="420.0" y="525.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Codex · OpenCode · Warp</text><text x="420.0" y="542.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">v0.x, same tests</text><rect x="550" y="450" width="230" height="48" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="665.0" y="470.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Memory</text><text x="665.0" y="487.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">same repo or vault repo</text><rect x="550" y="506" width="230" height="46" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4"/><text x="665.0" y="525.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Managed vault</text><text x="665.0" y="542.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">v1</text><rect x="40" y="594" width="1120" height="150" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="56" y="616" text-anchor="start" font-size="12" font-weight="600" fill="#b45309">Versioned open formats · schemaVersion v0alpha1 · the most durable part of the kit</text><rect x="56" y="630" width="170" height="96" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="141.0" y="674.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">manifest.yaml</text><text x="141.0" y="691.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">project, actors, lines</text><rect x="239" y="630" width="170" height="96" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="324.0" y="674.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">estado.md</text><text x="324.0" y="691.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">work item frontmatter</text><rect x="422" y="630" width="170" height="96" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="507.0" y="674.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">decision.md</text><text x="507.0" y="691.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">who, which SHA, when</text><rect x="605" y="630" width="170" height="96" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="690.0" y="674.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">run.json</text><text x="690.0" y="691.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">executor, model, usage</text><rect x="788" y="630" width="170" height="96" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="873.0" y="674.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Commit trailers</text><text x="873.0" y="691.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">Obrador-Id / -Stage</text><rect x="971" y="630" width="170" height="96" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="1056.0" y="674.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">JSON Schemas</text><text x="1056.0" y="691.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">validatable by anyone</text><rect x="830" y="58" width="330" height="508" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="846" y="80" text-anchor="start" font-size="12" font-weight="600" fill="#15803d">Enforcement in the forge</text><text x="846" y="98" text-anchor="start" font-size="11" font-weight="400" fill="#6b7280">what blocks progress even if the agent insists</text><rect x="850" y="112" width="290" height="96" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="995.0" y="147.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Branch protection</text><text x="995.0" y="164.55" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">required approval; dismissed</text><text x="995.0" y="181.55" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">if the SHA changes</text><rect x="850" y="222" width="290" height="96" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="995.0" y="257.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">CODEOWNERS</text><text x="995.0" y="274.55" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">acceptance/, specs, .github/,</text><text x="995.0" y="291.55" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">manifest and AGENTS.md</text><rect x="850" y="332" width="290" height="96" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="995.0" y="367.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Reusable checks</text><text x="995.0" y="384.55" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">protected-paths · config-from-main</text><text x="995.0" y="401.55" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">test-oracle · dossier-lint</text><rect x="850" y="442" width="290" height="96" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="995.0" y="477.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">obrador/verify status</text><text x="995.0" y="494.55" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">published only by the</text><text x="995.0" y="511.55" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">verifier's identity</text><polyline points="170,138 170,212" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="235,288 235,300" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="605,288 605,300" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="175,390 175,450" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="420,390 420,450" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="665,390 665,450" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="800,474 830,474" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/></svg>