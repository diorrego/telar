<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="966" viewBox="0 0 1510 966" role="img" aria-labelledby="title desc">
<!-- Evidence. Translated from Spanish on 2026-11-24. Original: fabrica-de-software-con-agentes.svg (research workspace). -->
<title id="title">Agentic software factory</title><desc id="desc">A delegated objective goes through requirements, design, construction, validation and production. For each stage the diagram shows the agents' decisions, the decisions reserved for people and the evidence needed to advance. In operation it distinguishes service restoration, correction and improvement, with a return to prioritization.</desc><defs>
<marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#203e4b"/></marker>
<marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#12655d"/></marker>
<marker id="rust" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#914528"/></marker>
</defs><g font-family="DejaVu Sans, sans-serif">
<rect x="0" y="0" width="1510" height="966" rx="0" fill="#fbfcf9" stroke="none" stroke-width="1.3"/>
<text x="45" y="52" text-anchor="start" font-size="38" font-weight="700" fill="#203e4b">Agentic software factory</text>
<text x="47" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#49616a">From the business objective to a capability in production, with explicit decisions and permissions.</text>
<rect x="44" y="105" width="1420" height="62" rx="8" fill="#e7eeeb" stroke="none" stroke-width="1.3"/>
<text x="62" y="142" text-anchor="start" font-size="21" font-weight="700" fill="#203e4b">Human mandate</text>
<text x="303" y="142" text-anchor="start" font-size="17" font-weight="400" fill="#203e4b">Product sets the priority and the success criteria. Engineering and operations agree on permissions, limits and approvers.</text>
<text x="45" y="210" text-anchor="start" font-size="25" font-weight="700" fill="#203e4b">Create and deliver</text>
<text x="350" y="209" text-anchor="start" font-size="17" font-weight="400" fill="#49616a">The system picks the next work based on the objective and the available evidence.</text>
<rect x="44" y="291" width="1420" height="87" rx="8" fill="#e7f3ed" stroke="none" stroke-width="1.3"/>
<rect x="44" y="385" width="1420" height="71" rx="8" fill="#f7eee4" stroke="none" stroke-width="1.3"/>
<rect x="44" y="463" width="1420" height="69" rx="8" fill="#eaf0f3" stroke="none" stroke-width="1.3"/>
<text x="63" y="322" text-anchor="start" font-size="18" font-weight="700" fill="#12655d">Agents</text>
<text x="63" y="413" text-anchor="start" font-size="18" font-weight="700" fill="#914528">People</text>
<text x="63" y="491" text-anchor="start" font-size="18" font-weight="700" fill="#203e4b">Evidence</text>
<text x="63" y="346" text-anchor="start" font-size="14" font-weight="400" fill="#49616a">Delegated decision</text>
<text x="63" y="437" text-anchor="start" font-size="14" font-weight="400" fill="#49616a">Reserved decision</text>
<text x="63" y="515" text-anchor="start" font-size="14" font-weight="400" fill="#49616a">To advance</text>
<rect x="232" y="233" width="236" height="47" rx="8" fill="#e7eeec" stroke="none" stroke-width="1.3"/>
<text x="350.0" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#203e4b">Agree requirements</text>
<path d="M 468 256 H 480" fill="none" stroke="#203e4b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ink)"/>
<text x="240" y="316" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">Consult the domain,</text>
<text x="240" y="338" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">propose criteria and</text>
<text x="240" y="360" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">detect ambiguities.</text>
<text x="240" y="412" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">Decide ambiguous</text>
<text x="240" y="434" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">business rules.</text>
<text x="240" y="490" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">Agreed requirement and</text>
<text x="240" y="512" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">acceptance examples.</text>
<rect x="481" y="233" width="236" height="47" rx="8" fill="#e7eeec" stroke="none" stroke-width="1.3"/>
<text x="599.0" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#203e4b">Design and plan</text>
<path d="M 717 256 H 729" fill="none" stroke="#203e4b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ink)"/>
<text x="489" y="316" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">Compare options,</text>
<text x="489" y="338" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">split the work and</text>
<text x="489" y="360" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">order dependencies.</text>
<text x="489" y="412" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">Approve reserved</text>
<text x="489" y="434" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">architecture changes.</text>
<text x="489" y="490" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">Plan tied to the requirement</text>
<text x="489" y="512" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">and recorded decisions.</text>
<rect x="730" y="233" width="236" height="47" rx="8" fill="#e7eeec" stroke="none" stroke-width="1.3"/>
<text x="848.0" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#203e4b">Build and integrate</text>
<path d="M 966 256 H 978" fill="none" stroke="#203e4b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ink)"/>
<text x="738" y="316" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">Implement changes,</text>
<text x="738" y="338" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">integrate them and adapt</text>
<text x="738" y="360" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">the plan if needed.</text>
<text x="738" y="412" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">Resolve exceptions or</text>
<text x="738" y="434" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">take on domain tasks.</text>
<text x="738" y="490" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">Identified version and</text>
<text x="738" y="512" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">integration tests.</text>
<rect x="979" y="233" width="236" height="47" rx="8" fill="#e7eeec" stroke="none" stroke-width="1.3"/>
<text x="1097.0" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#203e4b">Verify and validate</text>
<path d="M 1215 256 H 1227" fill="none" stroke="#203e4b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ink)"/>
<text x="987" y="316" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">Run tests and</text>
<text x="987" y="338" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">compare the result</text>
<text x="987" y="360" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">with reference cases.</text>
<text x="987" y="412" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">Validate usefulness and</text>
<text x="987" y="434" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">authorize new criteria.</text>
<text x="987" y="490" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">Results per criterion and</text>
<text x="987" y="512" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">pending discrepancies.</text>
<rect x="1228" y="233" width="236" height="47" rx="8" fill="#12655d" stroke="none" stroke-width="1.3"/>
<text x="1346.0" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="white">Ship to production</text>
<text x="1236" y="316" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">Deploy the authorized</text>
<text x="1236" y="338" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">pilot and observe</text>
<text x="1236" y="360" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">its behavior.</text>
<text x="1236" y="412" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">Authorize the expansion</text>
<text x="1236" y="434" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">when the policy requires it.</text>
<text x="1236" y="490" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">Version in use and result</text>
<text x="1236" y="512" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">checked in the pilot.</text>
<path d="M 1070 532 V 553 H 608 V 534" fill="none" stroke="#12655d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)" stroke-dasharray="7 5"/>
<rect x="686" y="542" width="309" height="22" rx="0" fill="#fbfcf9" stroke="none" stroke-width="1.3"/>
<text x="840" y="557" text-anchor="middle" font-size="14" font-weight="400" fill="#12655d">If it fails, revise the plan or the change</text>
<rect x="44" y="579" width="1420" height="56" rx="8" fill="#e7eeeb" stroke="none" stroke-width="1.3"/>
<text x="62" y="613" text-anchor="start" font-size="20" font-weight="700" fill="#203e4b">Shared state</text>
<text x="303" y="613" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">Each run retrieves the objective, the version, the decisions and the tests. Exceptions go to the designated owner.</text>
<path d="M 1464 256 H 1487 V 735 H 1467" fill="none" stroke="#12655d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<text x="45" y="681" text-anchor="start" font-size="25" font-weight="700" fill="#203e4b">Operation and evolution</text>
<rect x="1168" y="700" width="296" height="78" rx="8" fill="#eaf5ef" stroke="#9abdb1" stroke-width="1.3"/>
<text x="1183" y="726" text-anchor="start" font-size="17" font-weight="700" fill="#12655d">Operate the service</text>
<text x="1183" y="750" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">Agents observe usage and</text>
<text x="1183" y="770" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">detect signs of degradation.</text>
<rect x="834" y="700" width="262" height="78" rx="8" fill="#fff2e9" stroke="#dab49c" stroke-width="1.3"/>
<text x="849" y="726" text-anchor="start" font-size="17" font-weight="700" fill="#914528">Handle the incident</text>
<text x="849" y="750" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">Investigate the impact and</text>
<text x="849" y="770" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">apply an authorized mitigation.</text>
<rect x="503" y="700" width="260" height="78" rx="8" fill="#fff2e9" stroke="#dab49c" stroke-width="1.3"/>
<text x="518" y="726" text-anchor="start" font-size="17" font-weight="700" fill="#914528">Restore the service</text>
<text x="518" y="750" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">Verify recovery and</text>
<text x="518" y="770" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">report the result.</text>
<path d="M 1168 737 H 1098" fill="none" stroke="#914528" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#rust)"/>
<text x="1133" y="726" text-anchor="middle" font-size="14" font-weight="400" fill="#914528">failure</text>
<path d="M 834 737 H 765" fill="none" stroke="#914528" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#rust)"/>
<rect x="503" y="831" width="260" height="74" rx="8" fill="#fff2e9" stroke="#dab49c" stroke-width="1.3"/>
<text x="518" y="857" text-anchor="start" font-size="17" font-weight="700" fill="#914528">Investigate the cause</text>
<text x="518" y="881" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">Propose a permanent</text>
<text x="518" y="901" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">correction.</text>
<path d="M 632 779 V 829" fill="none" stroke="#914528" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#rust)" stroke-dasharray="7 5"/>
<text x="645" y="809" text-anchor="start" font-size="14" font-weight="400" fill="#914528">if it persists</text>
<rect x="891" y="831" width="267" height="74" rx="8" fill="#eaf5ef" stroke="#9abdb1" stroke-width="1.3"/>
<text x="906" y="857" text-anchor="start" font-size="17" font-weight="700" fill="#12655d">Propose an improvement</text>
<text x="906" y="881" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">Turn usage evidence into</text>
<text x="906" y="901" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">a proposal for product.</text>
<path d="M 1315 779 V 868 H 1160" fill="none" stroke="#12655d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<rect x="55" y="829" width="320" height="78" rx="8" fill="#eaf5ef" stroke="#9abdb1" stroke-width="1.3"/>
<text x="70" y="855" text-anchor="start" font-size="17" font-weight="700" fill="#12655d">Prioritize the change</text>
<text x="70" y="879" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">Product decides which fixes and</text>
<text x="70" y="899" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">improvements rejoin the delivery cycle.</text>
<path d="M 503 868 H 377" fill="none" stroke="#12655d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<path d="M 1024 906 V 935 H 215 V 909" fill="none" stroke="#12655d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<path d="M 55 867 H 23 V 256 H 230" fill="none" stroke="#12655d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<text x="58" y="248" text-anchor="start" font-size="14" font-weight="400" fill="#12655d">Prioritized change</text>
</g></svg>