<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Inter, Helvetica, Arial, sans-serif">
<!-- Evidence. Translated from Spanish on 2026-11-24. Original: recorrido-de-un-encargo.svg (research workspace). -->
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect width="1200" height="560" fill="#ffffff"/><text x="40" y="34" text-anchor="start" font-size="14" font-weight="600" fill="#1f2937">Journey of a work item on the standard line: agents propose, code and the forge decide if it advances, people decide what and if it is delivered</text><rect x="20" y="60" width="1160" height="104" rx="10" fill="#e0f2fe" fill-opacity="0.35" stroke="#0369a1" stroke-opacity="0.5"/><text x="32" y="106" text-anchor="start" font-size="13" font-weight="600" fill="#0369a1">People</text><text x="32" y="124" text-anchor="start" font-size="10" font-weight="400" fill="#6b7280">decide what and if delivered</text><rect x="20" y="180" width="1160" height="104" rx="10" fill="#dcfce7" fill-opacity="0.35" stroke="#15803d" stroke-opacity="0.5"/><text x="32" y="226" text-anchor="start" font-size="13" font-weight="600" fill="#15803d">Code and forge</text><text x="32" y="244" text-anchor="start" font-size="10" font-weight="400" fill="#6b7280">decide if the work advances</text><rect x="20" y="300" width="1160" height="104" rx="10" fill="#ede9fe" fill-opacity="0.35" stroke="#7c3aed" stroke-opacity="0.5"/><text x="32" y="346" text-anchor="start" font-size="13" font-weight="600" fill="#7c3aed">Agents</text><text x="32" y="364" text-anchor="start" font-size="10" font-weight="400" fill="#6b7280">propose and produce evidence</text><rect x="180" y="80" width="92" height="64" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="226.0" y="108.35" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">Opens item</text><text x="226.0" y="123.35" text-anchor="middle" font-size="10" font-weight="400" fill="#6b7280">CLI or issue</text><rect x="280" y="320" width="92" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="326.0" y="348.35" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">Triage</text><text x="326.0" y="363.35" text-anchor="middle" font-size="10" font-weight="400" fill="#6b7280">line and risk</text><rect x="380" y="320" width="92" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="426.0" y="348.35" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">Product spec</text><text x="426.0" y="363.35" text-anchor="middle" font-size="10" font-weight="400" fill="#6b7280">+ technical (PR)</text><rect x="480" y="80" width="92" height="64" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="526.0" y="108.35" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">Approves spec</text><text x="526.0" y="123.35" text-anchor="middle" font-size="10" font-weight="400" fill="#6b7280">CODEOWNER</text><rect x="480" y="200" width="92" height="64" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/><text x="526.0" y="228.35" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">G1 approval</text><text x="526.0" y="243.35" text-anchor="middle" font-size="10" font-weight="400" fill="#6b7280">tied to the SHA</text><rect x="580" y="320" width="92" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="626.0" y="348.35" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">Builds</text><text x="626.0" y="363.35" text-anchor="middle" font-size="10" font-weight="400" fill="#6b7280">new session</text><rect x="680" y="200" width="92" height="64" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/><text x="726.0" y="228.35" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">G2 CI +</text><text x="726.0" y="243.35" text-anchor="middle" font-size="10" font-weight="400" fill="#6b7280">protected paths</text><rect x="780" y="320" width="92" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="826.0" y="348.35" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">Verifies</text><text x="826.0" y="363.35" text-anchor="middle" font-size="10" font-weight="400" fill="#6b7280">other identity</text><rect x="880" y="200" width="92" height="64" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/><text x="926.0" y="228.35" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">G3 status</text><text x="926.0" y="243.35" text-anchor="middle" font-size="10" font-weight="400" fill="#6b7280">obrador/verify</text><rect x="880" y="320" width="92" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="926.0" y="348.35" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">HTML summary</text><text x="926.0" y="363.35" text-anchor="middle" font-size="10" font-weight="400" fill="#6b7280">+ dossier</text><rect x="980" y="80" width="92" height="64" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/><text x="1026.0" y="108.35" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">Reviews</text><text x="1026.0" y="123.35" text-anchor="middle" font-size="10" font-weight="400" fill="#6b7280">and merges</text><rect x="980" y="200" width="92" height="64" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/><text x="1026.0" y="228.35" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">G4 branch</text><text x="1026.0" y="243.35" text-anchor="middle" font-size="10" font-weight="400" fill="#6b7280">protection</text><rect x="1080" y="200" width="92" height="64" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/><text x="1126.0" y="228.35" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">Follow-up</text><text x="1126.0" y="243.35" text-anchor="middle" font-size="10" font-weight="400" fill="#6b7280">14 and 30 days</text><polyline points="226.0,144 226.0,352 280,352" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="372,352 380,352" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="426.0,320 426.0,112 480,112" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="526.0,144 526.0,200" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="526.0,264 526.0,352 580,352" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="626.0,320 626.0,232 680,232" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="726.0,264 726.0,352 780,352" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="872,352 880,352" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="926.0,320 926.0,264" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="926.0,200 926.0,112 980,112" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="1026.0,144 1026.0,200" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="1072,232 1080,232" fill="none" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="826.0,384 826.0,420 626.0,420 626.0,384" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5 4"/><text x="726.0" y="438" text-anchor="middle" font-size="11" font-weight="400" fill="#dc2626">reproducible failure: rebuild (max. N attempts)</text><text x="32" y="470" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">• Light line (trivial, unambiguous task): no technical spec, but always with protected acceptance examples.</text><text x="32" y="492" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">• If the diff touches high-risk paths declared in the manifest, G2 requires the standard or strict line.</text><text x="32" y="514" text-anchor="start" font-size="12" font-weight="400" fill="#1f2937">• Budget or attempts exhausted: status "blocked" with a reason; the work item waits for a human decision.</text></svg>