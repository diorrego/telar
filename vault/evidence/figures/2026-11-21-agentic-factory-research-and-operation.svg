<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="1206" viewBox="0 0 1510 1206" role="img" aria-labelledby="title desc">
<!-- Evidence. Translated from Spanish on 2026-11-24. Original: fabrica-con-agentes-investigacion-y-operacion.svg (research workspace). -->
<title id="title">Agentic software factory</title><desc id="desc">A delegated objective goes through research, requirements, design, construction, validation and production. For each stage the diagram shows the agents' decisions, the decisions reserved for people and the evidence needed to advance. In operation it distinguishes service restoration, correction and improvement, with a return to prioritization.</desc><defs>
<marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#203e4b"/></marker>
<marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#12655d"/></marker>
<marker id="rust" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#914528"/></marker>
</defs><g font-family="DejaVu Sans, sans-serif">
<rect x="0" y="0" width="1510" height="1206" rx="0" fill="#fbfcf9" stroke="none" stroke-width="1.3"/>
<text x="45" y="52" text-anchor="start" font-size="38" font-weight="700" fill="#203e4b">Agentic software factory</text>
<text x="47" y="82" text-anchor="start" font-size="20" font-weight="400" fill="#49616a">From a need still to be researched to a delivery in production.</text>
<rect x="44" y="105" width="1420" height="62" rx="8" fill="#e7eeeb" stroke="none" stroke-width="1.3"/>
<text x="62" y="142" text-anchor="start" font-size="21" font-weight="700" fill="#203e4b">Human mandate</text>
<text x="303" y="142" text-anchor="start" font-size="17" font-weight="400" fill="#203e4b">A person or a team sets the objective, the limits and who decides. The initial solution stays open to revision.</text>
<text x="45" y="210" text-anchor="start" font-size="25" font-weight="700" fill="#203e4b">Create and deliver</text>
<text x="350" y="209" text-anchor="start" font-size="17" font-weight="400" fill="#49616a">The system picks the next work based on the objective and the available evidence.</text>
<rect x="44" y="291" width="1420" height="87" rx="8" fill="#e7f3ed" stroke="none" stroke-width="1.3"/>
<rect x="44" y="385" width="1420" height="71" rx="8" fill="#f7eee4" stroke="none" stroke-width="1.3"/>
<rect x="44" y="463" width="1420" height="69" rx="8" fill="#eaf0f3" stroke="none" stroke-width="1.3"/>
<text x="63" y="322" text-anchor="start" font-size="18" font-weight="700" fill="#12655d">Agents</text>
<text x="63" y="413" text-anchor="start" font-size="18" font-weight="700" fill="#914528">People</text>
<text x="63" y="491" text-anchor="start" font-size="18" font-weight="700" fill="#203e4b">Evidence</text>
<text x="63" y="346" text-anchor="start" font-size="14" font-weight="400" fill="#49616a">Delegated decision</text>
<text x="63" y="437" text-anchor="start" font-size="14" font-weight="400" fill="#49616a">Reserved decision</text>
<text x="63" y="515" text-anchor="start" font-size="14" font-weight="400" fill="#49616a">To advance</text>
<rect x="211" y="233" width="198" height="47" rx="8" fill="#e7eeec" stroke="none" stroke-width="1.3"/>
<text x="310.0" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#203e4b">Research</text>
<path d="M 409 256 H 421" fill="none" stroke="#203e4b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ink)"/>
<text x="217" y="316" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">Cross-check documents,</text>
<text x="217" y="338" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">web, data and the practice</text>
<text x="217" y="360" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">of the system's users.</text>
<text x="217" y="412" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">Provide context and</text>
<text x="217" y="434" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">explain contradictions.</text>
<text x="217" y="490" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">Findings, sources and</text>
<text x="217" y="512" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">reviewed assumptions.</text>
<rect x="422" y="233" width="198" height="47" rx="8" fill="#e7eeec" stroke="none" stroke-width="1.3"/>
<text x="521.0" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#203e4b">Agree requirements</text>
<path d="M 620 256 H 632" fill="none" stroke="#203e4b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ink)"/>
<text x="428" y="316" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">Propose the scope and</text>
<text x="428" y="338" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">translate the findings</text>
<text x="428" y="360" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">into acceptance cases.</text>
<text x="428" y="412" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">Choose which need</text>
<text x="428" y="434" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">to meet, with what rules.</text>
<text x="428" y="490" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">Versioned requirement</text>
<text x="428" y="512" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">and agreed examples.</text>
<rect x="633" y="233" width="198" height="47" rx="8" fill="#e7eeec" stroke="none" stroke-width="1.3"/>
<text x="732.0" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#203e4b">Design and plan</text>
<path d="M 831 256 H 843" fill="none" stroke="#203e4b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ink)"/>
<text x="639" y="316" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">Compare options,</text>
<text x="639" y="338" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">order dependencies and</text>
<text x="639" y="360" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">define the increments.</text>
<text x="639" y="412" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">Approve reserved</text>
<text x="639" y="434" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">architecture decisions.</text>
<text x="639" y="490" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">Plan, base revisions</text>
<text x="639" y="512" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">and decisions.</text>
<rect x="844" y="233" width="198" height="47" rx="8" fill="#e7eeec" stroke="none" stroke-width="1.3"/>
<text x="943.0" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#203e4b">Build and integrate</text>
<path d="M 1042 256 H 1054" fill="none" stroke="#203e4b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ink)"/>
<text x="850" y="316" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">Integrate changes and</text>
<text x="850" y="338" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">adapt the work to what</text>
<text x="850" y="360" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">is being discovered.</text>
<text x="850" y="412" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">Resolve domain</text>
<text x="850" y="434" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">exceptions.</text>
<text x="850" y="490" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">Change version and</text>
<text x="850" y="512" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">integration tests.</text>
<rect x="1055" y="233" width="198" height="47" rx="8" fill="#e7eeec" stroke="none" stroke-width="1.3"/>
<text x="1154.0" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#203e4b">Verify and validate</text>
<path d="M 1253 256 H 1265" fill="none" stroke="#203e4b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ink)"/>
<text x="1061" y="316" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">Test the change against</text>
<text x="1061" y="338" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">reference cases and</text>
<text x="1061" y="360" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">record discrepancies.</text>
<text x="1061" y="412" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">Validate usefulness and</text>
<text x="1061" y="434" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">authorize new criteria.</text>
<text x="1061" y="490" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">Results per criterion</text>
<text x="1061" y="512" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">and open items.</text>
<rect x="1266" y="233" width="198" height="47" rx="8" fill="#12655d" stroke="none" stroke-width="1.3"/>
<text x="1365.0" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="white">Ship to production</text>
<text x="1272" y="316" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">Deploy an authorized</text>
<text x="1272" y="338" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">pilot and observe</text>
<text x="1272" y="360" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">how it is used.</text>
<text x="1272" y="412" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">Authorize the expansion</text>
<text x="1272" y="434" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">if the policy requires it.</text>
<text x="1272" y="490" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">Version in use and</text>
<text x="1272" y="512" text-anchor="start" font-size="14" font-weight="400" fill="#203e4b">pilot result.</text>
<path d="M 1150 532 V 553 H 727 V 534" fill="none" stroke="#12655d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)" stroke-dasharray="7 5"/>
<rect x="789" y="542" width="305" height="22" rx="0" fill="#fbfcf9" stroke="none" stroke-width="1.3"/>
<text x="941" y="557" text-anchor="middle" font-size="14" font-weight="400" fill="#12655d">If it fails, revise the plan or the change</text>
<rect x="44" y="579" width="1420" height="56" rx="8" fill="#e7eeeb" stroke="none" stroke-width="1.3"/>
<text x="62" y="613" text-anchor="start" font-size="20" font-weight="700" fill="#203e4b">Shared state</text>
<text x="303" y="613" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">Each run retrieves the objective, the version, the decisions and the tests. Exceptions go to the designated owner.</text>
<path d="M 1464 256 H 1487 V 735 H 1467" fill="none" stroke="#12655d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<text x="45" y="681" text-anchor="start" font-size="25" font-weight="700" fill="#203e4b">Operation and evolution</text>
<rect x="1168" y="700" width="296" height="78" rx="8" fill="#eaf5ef" stroke="#9abdb1" stroke-width="1.3"/>
<text x="1183" y="726" text-anchor="start" font-size="17" font-weight="700" fill="#12655d">Operate the service</text>
<text x="1183" y="750" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">Agents observe usage and</text>
<text x="1183" y="770" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">detect signs of degradation.</text>
<rect x="834" y="700" width="262" height="78" rx="8" fill="#fff2e9" stroke="#dab49c" stroke-width="1.3"/>
<text x="849" y="726" text-anchor="start" font-size="17" font-weight="700" fill="#914528">Handle the incident</text>
<text x="849" y="750" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">Investigate the impact and</text>
<text x="849" y="770" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">request the agreed action.</text>
<rect x="503" y="700" width="260" height="78" rx="8" fill="#fff2e9" stroke="#dab49c" stroke-width="1.3"/>
<text x="518" y="726" text-anchor="start" font-size="17" font-weight="700" fill="#914528">Restore the service</text>
<text x="518" y="750" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">Verify recovery and</text>
<text x="518" y="770" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">report the result.</text>
<path d="M 1168 737 H 1098" fill="none" stroke="#914528" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#rust)"/>
<text x="1133" y="726" text-anchor="middle" font-size="14" font-weight="400" fill="#914528">failure</text>
<path d="M 834 737 H 765" fill="none" stroke="#914528" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#rust)"/>
<rect x="503" y="831" width="260" height="74" rx="8" fill="#fff2e9" stroke="#dab49c" stroke-width="1.3"/>
<text x="518" y="857" text-anchor="start" font-size="17" font-weight="700" fill="#914528">Investigate the cause</text>
<text x="518" y="881" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">Propose a permanent</text>
<text x="518" y="901" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">correction.</text>
<path d="M 632 779 V 829" fill="none" stroke="#914528" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#rust)" stroke-dasharray="7 5"/>
<text x="645" y="809" text-anchor="start" font-size="14" font-weight="400" fill="#914528">if it persists</text>
<rect x="891" y="831" width="267" height="74" rx="8" fill="#eaf5ef" stroke="#9abdb1" stroke-width="1.3"/>
<text x="906" y="857" text-anchor="start" font-size="17" font-weight="700" fill="#12655d">Propose an improvement</text>
<text x="906" y="881" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">Turn usage evidence into</text>
<text x="906" y="901" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">a proposal for product.</text>
<path d="M 1315 779 V 868 H 1160" fill="none" stroke="#12655d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<rect x="55" y="829" width="320" height="78" rx="8" fill="#eaf5ef" stroke="#9abdb1" stroke-width="1.3"/>
<text x="70" y="855" text-anchor="start" font-size="17" font-weight="700" fill="#12655d">Prioritize the change</text>
<text x="70" y="879" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">Product decides which fixes and</text>
<text x="70" y="899" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">improvements rejoin the delivery cycle.</text>
<path d="M 503 868 H 377" fill="none" stroke="#12655d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<path d="M 1024 906 V 935 H 215 V 909" fill="none" stroke="#12655d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<path d="M 55 867 H 23 V 256 H 209" fill="none" stroke="#12655d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<text x="58" y="248" text-anchor="start" font-size="14" font-weight="400" fill="#12655d">Prioritized change</text>
<text x="45" y="988" text-anchor="start" font-size="25" font-weight="700" fill="#203e4b">How it is triggered and where it runs</text>
<rect x="45" y="1007" width="333" height="95" rx="8" fill="#eaf0f3" stroke="none" stroke-width="1.3"/>
<text x="59" y="1035" text-anchor="start" font-size="18" font-weight="700" fill="#203e4b">Inputs</text>
<text x="59" y="1062" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">Slack, Discord, email, local agent,</text>
<text x="59" y="1084" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">schedule or CI/CD event.</text>
<path d="M 378 1051 H 398" fill="none" stroke="#203e4b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ink)"/>
<rect x="401" y="1007" width="333" height="95" rx="8" fill="#eaf0f3" stroke="none" stroke-width="1.3"/>
<text x="415" y="1035" text-anchor="start" font-size="18" font-weight="700" fill="#203e4b">Rules and coordination</text>
<text x="415" y="1062" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">Versioned policy, durable queue,</text>
<text x="415" y="1084" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">approval tied to the version.</text>
<path d="M 734 1051 H 754" fill="none" stroke="#203e4b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ink)"/>
<rect x="757" y="1007" width="333" height="95" rx="8" fill="#eaf0f3" stroke="none" stroke-width="1.3"/>
<text x="771" y="1035" text-anchor="start" font-size="18" font-weight="700" fill="#203e4b">Executors</text>
<text x="771" y="1062" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">Service available in the cloud/VPC;</text>
<text x="771" y="1084" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">local agent for specific tasks.</text>
<path d="M 1090 1051 H 1110" fill="none" stroke="#203e4b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ink)"/>
<rect x="1113" y="1007" width="333" height="95" rx="8" fill="#eaf0f3" stroke="none" stroke-width="1.3"/>
<text x="1127" y="1035" text-anchor="start" font-size="18" font-weight="700" fill="#203e4b">Evidence and results</text>
<text x="1127" y="1062" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">Read-only queries; code changes</text>
<text x="1127" y="1084" text-anchor="start" font-size="15" font-weight="400" fill="#203e4b">in GitHub branches and PRs.</text>
<rect x="45" y="1120" width="1401" height="60" rx="8" fill="#e7eeeb" stroke="none" stroke-width="1.3"/>
<text x="62" y="1157" text-anchor="start" font-size="19" font-weight="700" fill="#203e4b">Tracking</text>
<text x="230" y="1157" text-anchor="start" font-size="16" font-weight="400" fill="#203e4b">Every event, query, human decision and run shares the work item identifier. The result returns to the originating channel.</text>
</g></svg>